[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigap"
version = "0.1.0"
description = "SIGAP — Agen Karhutla: Autonomous Wildfire Investigation & Response Prioritization Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "SIGAP Team" },
]
keywords = [
    "wildfire",
    "karhutla",
    "agentic-ai",
    "multi-agent",
    "google-adk",
    "gemini",
    "earth-engine",
    "fastapi",
    "remote-sensing",
    "u-net",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "earthengine-api>=0.1.400",
    "rasterio>=1.3.10",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "numpy>=1.26.0,<2.0.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "scikit-learn>=1.4.0",
    "Pillow>=10.2.0",
    "python-dotenv>=1.0.1",
    "redis>=5.0.0",
    "weasyprint>=62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend/app"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line length violations (handled by ruff format)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "weights/",
    "data/",
]
